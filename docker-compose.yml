services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      # Modelos ficam persistidos: baixa uma vez, sobrevive a rebuild/restart
      - ollama_data:/root/.ollama
    # Roda em CPU por default. Para usar GPU NVIDIA, adicione o override:
    #   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up

  backend:
    build: ./backend
    ports:
      - "5000:5000"
    volumes:
      - ./backend/src:/app
    environment:
      QDRANT_URL: http://qdrant:6333
      # Default aponta para o serviço no compose; sobrescreva para usar Ollama no host
      OLLAMA_HOST: ${OLLAMA_HOST:-http://ollama:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      qdrant:
        condition: service_started
      ollama:
        condition: service_started

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_URL: http://localhost:5000
    depends_on:
      - backend

volumes:
  qdrant_data:
  ollama_data:
