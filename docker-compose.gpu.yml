# Override opcional: adiciona a GPU NVIDIA ao serviço ollama.
# Exige nvidia-container-toolkit no host (rode antes: bash scripts/setup-gpu).
#
# Uso:
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up --build
services:
  ollama:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
